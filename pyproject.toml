[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-probe"
version = "0.1.0"
description = "A transparent reverse proxy and recorder for Codex LLM calls."
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"